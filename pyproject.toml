[project]
name = "openv"
version = "0.1.0"
description = "Bootstrap your UNIX environment from a dotfiles repository"
readme = "README.md"
authors = [
    { name = "Oleg Stepanov", email = "oleg.stepanov@gmail.com" }
]
requires-python = "==3.11.*"
license = { text = "MIT" }
dependencies = [
    "questionary>=2.0",
    "rich>=13.0",
]

[project.scripts]
openv = "openv.cli:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "pydoclint>=0.8.4",
    "pyright>=1.1.409",
    "ruff>=0.15.15",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (basic security)
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
    "D",   # pydocstyle
]
ignore = [
    # Style choices:
    "D105",  # missing docstring in magic methods (__str__, __repr__, etc.)
    "D107",  # missing docstring in __init__ — document on the class instead
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["openv"]

[tool.ruff.lint.pydocstyle]
convention = "google"  # or "numpy" / "pep257"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D104"]      # empty __init__.py is fine
"dev/**" = ["ANN", "TCH", "S603"]  # dev scripts, no typing required

[tool.basedpyright]
reportUnusedCallResult = "none"
include = ["src"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false  # types live in annotations, not docstrings
check-return-types = true
check-yield-types = true
allow-init-docstring = false         # matches ignoring D107 above